<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#092b52">
<title>Troca de Turno</title>
<style>
:root{--navy:#092b52;--blue:#0f6cbd;--light:#e8f3fb;--white:#fff;--ink:#172b3f;--muted:#62788e;--ok:#107c10;--danger:#c42b1c;--line:#dce6ef;--shadow:0 10px 28px rgba(9,43,82,.12)}
*{box-sizing:border-box}body{margin:0;background:#f5f8fb;color:var(--ink);font-family:Segoe UI,Arial,sans-serif}button,input,textarea{font:inherit}button{cursor:pointer}.shell{min-height:100vh}.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:14px clamp(16px,4vw,52px);background:rgba(9,43,82,.97);color:#fff;box-shadow:0 3px 14px #092b5240}.brand{display:flex;align-items:center;gap:12px}.logo{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font-weight:800;background:linear-gradient(145deg,#5ec5ff,#0f6cbd);box-shadow:inset 0 0 0 1px #ffffff35}.brand small{display:block;color:#cdeaff}.clock{text-align:right;font-size:13px;color:#dbefff}.clock strong{display:block;font-size:16px;color:#fff}.container{max-width:1320px;margin:auto;padding:clamp(18px,4vw,48px)}.hero{display:grid;grid-template-columns:1.45fr .75fr;gap:24px}.hero-main{padding:clamp(26px,5vw,56px);border-radius:28px;color:#fff;background:linear-gradient(135deg,var(--navy),#0b4f88 70%,#168dd0);box-shadow:var(--shadow)}.eyebrow{text-transform:uppercase;letter-spacing:1.8px;font-size:12px;font-weight:700;color:#82d4ff}.hero h1{font-size:clamp(30px,5vw,58px);line-height:1.04;margin:12px 0 18px}.hero p{font-size:17px;line-height:1.55;color:#d9efff}.hero-side,.panel,.sector-card,.kpi,.report-card{background:#fff;border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow)}.hero-side{padding:28px;display:flex;flex-direction:column;justify-content:space-between}.person{background:var(--light);padding:18px;border-radius:16px}.person label,.field label{display:block;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin-bottom:8px}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px}.btn{border:0;border-radius:12px;padding:12px 18px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:.18s}.btn:hover{transform:translateY(-1px)}.primary{background:var(--blue);color:#fff}.secondary{background:#fff;color:var(--navy);border:1px solid #aabfd2}.ghost{background:var(--light);color:var(--blue)}.danger{background:#fff0ef;color:var(--danger);border:1px solid #f2c2be}.page-head{display:flex;align-items:end;justify-content:space-between;gap:18px;margin-bottom:24px}.page-head h2{margin:0 0 6px;font-size:clamp(26px,4vw,38px)}.page-head p,.meta{margin:0;color:var(--muted)}.panel{padding:clamp(18px,3vw,30px);margin-bottom:24px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.field.full{grid-column:1/-1}.field input,.field textarea{width:100%;border:1px solid #b8c9d8;border-radius:12px;padding:13px;background:#fff;outline:none}.field textarea{min-height:90px;resize:vertical}.ops-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.ops-box{border:1px solid var(--line);border-radius:16px;overflow:hidden}.ops-box h4{margin:0;padding:11px 14px;background:#bfe9fb;color:#092b52;text-align:center}.ops-rows{padding:14px;display:grid;gap:10px}.ops-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:center}.ops-row label{font-size:13px;font-weight:700;color:var(--ink)}.ops-row input,.ops-row select{width:100%;border:1px solid #b8c9d8;border-radius:9px;padding:9px;background:#fff}.report-table-card{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;font-size:13px}.report-table-title{padding:8px;background:#85d3f2;color:#092b52;text-align:center;font-weight:800}.report-table-subtitle{padding:7px;background:#bfe9fb;color:#092b52;text-align:center;font-weight:800}.report-table-row{display:grid;grid-template-columns:1.15fr 1fr;border-top:1px solid #9aa8b5}.report-table-row span{padding:6px 8px;min-height:27px}.report-table-row span+span{border-left:1px solid #9aa8b5;color:#0645ff;font-weight:700;text-align:center}.team-head,.team-row{display:grid;grid-template-columns:1fr 1fr}.team-head span{padding:7px;text-align:center;font-weight:800;color:#e31b14}.team-row{border-top:1px solid #9aa8b5}.team-row span{padding:6px 8px}.team-row span+span{border-left:1px solid #9aa8b5}.section-title{margin:32px 0 16px;display:flex;justify-content:space-between;align-items:center}.progress{color:var(--blue);font-weight:700}.sectors{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.report{max-width:1520px;margin:0 auto}
.report-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.report-card img,.no-photo{height:190px}.sector-card{padding:18px}.sector-top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:14px}.sector-top h4{margin:0}.status{font-size:12px;font-weight:700;padding:6px 9px;border-radius:99px;background:#eef2f5;color:var(--muted)}.status.ok{background:#e5f4e3;color:var(--ok)}.photo-zone{height:240px;border:2px dashed #a9bfd2;border-radius:16px;background:#f7fafc;display:flex;align-items:center;justify-content:center;overflow:hidden}.photo-zone img{width:100%;height:100%;object-fit:cover}.empty{text-align:center;color:var(--muted);padding:18px}.empty b{display:block;color:var(--blue);font-size:32px}.photo-actions{display:flex;gap:8px;margin-top:12px}.photo-actions .btn{flex:1;padding:9px;font-size:13px}.history-list{display:grid;gap:14px}.history-item{display:grid;grid-template-columns:1fr auto;align-items:center;gap:18px;padding:18px;border:1px solid var(--line);border-radius:16px}.history-item h4{margin:0 0 7px}.empty-state{text-align:center;padding:60px 22px;color:var(--muted)}.report{background:#eef3f8;min-height:100vh}.report-header{background:linear-gradient(135deg,var(--navy),#0f6cbd);color:#fff;border-radius:24px;padding:28px;display:flex;justify-content:space-between;gap:20px;align-items:center}.report-header h2{margin:6px 0}.report-header p{margin:0;color:#dbefff}.report-brand{display:flex;gap:15px;align-items:center}.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:20px 0}.kpi{padding:20px}.kpi small{color:var(--muted);font-weight:600}.kpi strong{display:block;font-size:28px;color:var(--navy);margin-top:8px}.report-card{overflow:hidden}.report-card h3{margin:0;padding:16px 18px;font-size:22px;font-weight:700;border-bottom:1px solid var(--line)}.report-card img{display:block;width:100%;height:190px;object-fit:cover}.no-photo{height:190px;display:grid;place-items:center;color:var(--muted);background:#eef3f7}.report-notes{margin-top:18px;padding:20px;background:#fff;border-radius:18px;border:1px solid var(--line)}.toast{position:fixed;right:20px;bottom:20px;z-index:50;background:#17324d;color:#fff;padding:14px 18px;border-radius:12px;box-shadow:var(--shadow);opacity:0;transform:translateY(20px);pointer-events:none;transition:.25s}.toast.show{opacity:1;transform:none}
@media(max-width:850px){.hero{grid-template-columns:1fr}.sectors,.report-grid,.kpis,.ops-grid{grid-template-columns:1fr}.report-card img,.no-photo{height:300px}}
@media(max-width:600px){.brand-text{display:none}.container{padding:16px}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.page-head,.report-header{align-items:stretch;flex-direction:column}.history-item{grid-template-columns:1fr}.actions .btn{width:100%}.photo-zone{height:210px}}
@media print{@page{size:landscape}.topbar,.no-print{display:none!important}.container{max-width:none;padding:0}.report{background:#fff}.report-header{print-color-adjust:exact}.report-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.report-card,.kpi{box-shadow:none;break-inside:avoid}.report-card img,.no-photo{height:200px}}
.pdf-loading{position:fixed;inset:0;z-index:80;background:#092b52cc;display:none;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:15px;letter-spacing:.3px}
.pdf-loading.show{display:flex}
</style>
</head>
<body><div class="shell"><header class="topbar"><div class="brand"><div class="logo">CD</div><div class="brand-text"><b>CD Logística</b><small>Controle operacional</small></div></div><div class="clock"><span id="dateNow"></span><strong id="timeNow"></strong></div></header><main id="app"></main></div><div id="toast" class="toast"></div>
<div id="pdfLoading" class="pdf-loading">⏳ Gerando PDF, aguarde...</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
(function(){
const sectors=['Mezanino / Térreo','Mezanino / 1º Andar','Recebimento','Corredor Central','Carregamento','Docas / Carregamento','Corredor / Exportação'];
const KEY='cd_auditoria_fotografica_v1'; let current=null;
const esc=v=>String(v||'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));
const records=()=>{try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){return[]}};
function saveAll(x){try{localStorage.setItem(KEY,JSON.stringify(x));return true}catch(e){toast('Armazenamento cheio. Exclua registros antigos.');return false}}
function toast(t){const x=document.getElementById('toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),2600)}
function nowLocal(){const d=new Date(),p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`}
const niceDate=s=>new Date(s).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'});
const wrap=c=>document.getElementById('app').innerHTML='<div class="container">'+c+'</div>';
function home(){const last=localStorage.getItem('cd_responsavel')||'';wrap(`<section class="hero"><div class="hero-main"><div class="eyebrow">CD Fortaleza</div><h1>Troca de Turno</h1><p>Registre evidências visuais, consulte inspeções anteriores e gere relatórios executivos do Centro de Distribuição.</p><div class="actions"><button class="btn primary" onclick="goForm()">＋ Novo Registro</button><button class="btn secondary" onclick="goHistory()">◷ Histórico</button></div></div><aside class="hero-side"><div><div class="eyebrow" style="color:#0f6cbd">Visão operacional</div><h2>Simples e rastreável</h2><p class="meta">Os dados ficam armazenados localmente neste dispositivo.</p></div><div class="person"><label>Último responsável</label><strong>${esc(last)||'Não informado'}</strong></div></aside></section>`)}
function goForm(){current={id:'r'+Date.now(),date:nowLocal(),responsible:localStorage.getItem('cd_responsavel')||'',notes:'',photos:{},turnInfo:{paresCarregados:'',paresEstoque:'',lovato:'',farrapo:'',vitoria:'',exportacao:'',aereo:''},team:{recebimento:['','','','',''],carregamento:['','','','','']}};renderForm()}
function sync(){current.date=document.getElementById('regDate').value;current.responsible=document.getElementById('responsible').value;current.notes=document.getElementById('notes').value;current.turnInfo=current.turnInfo||{};document.querySelectorAll('[data-turn]').forEach(x=>current.turnInfo[x.dataset.turn]=x.value);current.team=current.team||{recebimento:[],carregamento:[]};document.querySelectorAll('[data-team]').forEach(x=>{const [side,i]=x.dataset.team.split(':');current.team[side]=current.team[side]||[];current.team[side][+i]=x.value})}
function renderForm(){const cards=sectors.map((s,i)=>{const img=current.photos[s];return `<article class="sector-card"><div class="sector-top"><h4>${i+1}. ${s}</h4><span class="status ${img?'ok':''}">${img?'✓ Registrada':'Pendente'}</span></div><div class="photo-zone">${img?`<img src="${img}" alt="${esc(s)}">`:'<div class="empty"><b>▧</b>Selecione ou fotografe o setor</div>'}</div><input hidden type="file" id="f${i}" accept="image/*" capture="environment" onchange="pickPhoto(${i},this)"><div class="photo-actions"><button class="btn ghost" onclick="document.getElementById('f${i}').click()">${img?'↻ Trocar':'＋ Adicionar'}</button>${img?`<button class="btn danger" onclick="removePhoto(${i})">Remover</button>`:''}</div></article>`}).join('');wrap(`<div class="page-head"><div><h2>Novo registro </h2><p>Preencha os dados e capture as áreas auditadas.</p></div><button class="btn secondary" onclick="home()">← Início</button></div><section class="panel"><div class="form-grid"><div class="field"><label>Data e hora</label><input id="regDate" type="datetime-local" value="${current.date}" oninput="sync()"></div><div class="field"><label>Responsável</label><input id="responsible" value="${esc(current.responsible)}" placeholder="Nome completo" oninput="sync()"></div><div class="field full"><label>Observações gerais</label><textarea id="notes" placeholder="Informações relevantes..." oninput="sync()">${esc(current.notes)}</textarea></div></div><div class="section-title"><h3>Informações do turno e equipe</h3></div><div class="ops-grid"><div class="ops-box"><h4>Informações do Turno</h4><div class="ops-rows">${[['paresCarregados','Pares carregados'],['paresEstoque','Pares em estoque']].map(([k,l])=>`<div class="ops-row"><label>${l}</label><input data-turn="${k}" value="${esc((current.turnInfo||{})[k])}" placeholder="Informe o valor"></div>`).join('')}${[['lovato','Carregamento Lovato'],['farrapo','Carregamento Farrapo'],['vitoria','Carregamento Vitória'],['exportacao','Exportação'],['aereo','Aéreo']].map(([k,l])=>{const v=(current.turnInfo||{})[k]||'',opts=['1 Ordem Fechada','2 Ordens Fechadas','3 Ordens Fechadas','Não tivemos Carregamento'];return `<div class="ops-row"><label>${l}</label><select data-turn="${k}"><option value="">Selecione...</option>${opts.map(o=>`<option value="${esc(o)}" ${v===o?'selected':''}>${esc(o)}</option>`).join('')}</select></div>`}).join('')}</div></div><div class="ops-box"><h4>Dimensionamento da Equipe</h4><div class="ops-rows"><div class="ops-row"><label style="text-align:center;color:#c42b1c">Recebimento</label><label style="text-align:center;color:#c42b1c">Carregamento</label></div>${[0,1,2,3,4].map(i=>{const rec=['Julio Cesar Oliveira','Caua Vieira Dos Santos','Antonio Mario Duarte','Italo Patricio Crispim','Antonio Paulo Dos Santos'],car=['Francisco Lucas Apolonio','Francisco Guilherme','Carlos Wagner Rios','Francisco Wendel da Silva'],rv=((((current.team||{}).recebimento)||[])[i])||'',cv=((((current.team||{}).carregamento)||[])[i])||'';return `<div class="ops-row"><select data-team="recebimento:${i}"><option value="">Selecione...</option>${rec.map(n=>`<option value="${esc(n)}" ${rv===n?'selected':''}>${esc(n)}</option>`).join('')}</select><select data-team="carregamento:${i}"><option value="">Selecione...</option>${car.map(n=>`<option value="${esc(n)}" ${cv===n?'selected':''}>${esc(n)}</option>`).join('')}</select></div>`}).join('')}</div></div></div><div class="section-title"><h3>Setores para captura</h3><span class="progress">${Object.keys(current.photos).length} de ${sectors.length} fotos</span></div><div class="sectors">${cards}</div><div class="actions"><button class="btn primary" onclick="finish()">✓ Concluir e gerar dashboard</button><button class="btn secondary" onclick="home()">Cancelar</button></div></section>`)}
function resize(file){return new Promise((resolve,reject)=>{const rd=new FileReader();rd.onload=()=>{const im=new Image();im.onload=()=>{const max=1400,scale=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*scale);c.height=Math.round(im.height*scale);c.getContext('2d').drawImage(im,0,0,c.width,c.height);resolve(c.toDataURL('image/jpeg',.78))};im.onerror=reject;im.src=rd.result};rd.onerror=reject;rd.readAsDataURL(file)})}
async function pickPhoto(i,input){if(!input.files[0])return;sync();try{current.photos[sectors[i]]=await resize(input.files[0]);renderForm();toast('Foto registrada com sucesso.')}catch(e){toast('Não foi possível carregar a imagem.')}}
function removePhoto(i){sync();delete current.photos[sectors[i]];renderForm()}
function finish(){sync();if(!current.responsible.trim())return toast('Informe o responsável.');if(!current.date)return toast('Informe a data.');if(!Object.keys(current.photos).length)return toast('Adicione pelo menos uma foto.');localStorage.setItem('cd_responsavel',current.responsible.trim());const all=records();all.unshift(current);if(saveAll(all)){dashboard(current.id);toast('Registro salvo localmente.')}}
function goHistory(){const list=records().map(r=>`<article class="history-item"><div><h4>${esc(r.responsible)}</h4><div class="meta">${niceDate(r.date)} • ${Object.keys(r.photos||{}).length} fotos</div></div><div class="actions" style="margin:0"><button class="btn ghost" onclick="dashboard('${r.id}')">Abrir</button><button class="btn danger" onclick="delRecord('${r.id}')">Excluir</button></div></article>`).join('');wrap(`<div class="page-head"><div><h2>Histórico de inspeções</h2><p>Registros salvos neste navegador.</p></div><button class="btn secondary" onclick="home()">← Início</button></div><section class="panel">${list?'<div class="history-list">'+list+'</div>':'<div class="empty-state"><h3>Nenhum registro</h3><button class="btn primary" onclick="goForm()">Novo Registro</button></div>'}</section>`)}
function delRecord(id){if(!confirm('Excluir permanentemente este registro?'))return;saveAll(records().filter(r=>r.id!==id));goHistory();toast('Registro excluído.')}
function infoTable(r,inline){const t=r.turnInfo||{},team=r.team||{},rows=[['Pares Carregados',t.paresCarregados],['Pares Em Estoque',t.paresEstoque],['Carregamento Lovato',t.lovato],['Carregamento Farrapo',t.farrapo],['Carregamento Vitória',t.vitoria],['Exportação',t.exportacao],['Aéreo',t.aereo]];if(inline){return `<div style="border:1px solid #263746;overflow:hidden;background:#fff;font-family:Arial,sans-serif;font-size:12px;display:flex;flex-direction:column;height:100%"><div style="padding:7px;background:#85d3f2;font-weight:800;text-align:center">Informações do Turno</div>${rows.map(x=>`<div style="display:grid;grid-template-columns:1.2fr 1fr;border-top:1px solid #263746"><span style="padding:5px">${esc(x[0])}</span><span style="padding:5px;border-left:1px solid #263746;color:#0645ff;font-weight:700;text-align:center">${esc(x[1]||'—')}</span></div>`).join('')}<div style="padding:7px;background:#85d3f2;font-weight:800;text-align:center;border-top:1px solid #263746">Dimensionamento da Equipe</div><div style="display:grid;grid-template-columns:1fr 1fr"><span style="padding:5px;text-align:center;color:#e31b14;font-weight:800">Recebimento</span><span style="padding:5px;text-align:center;color:#e31b14;font-weight:800;border-left:1px solid #263746">Carregamento</span></div>${[0,1,2,3,4].map(i=>`<div style="display:grid;grid-template-columns:1fr 1fr;border-top:1px solid #263746"><span style="padding:5px">${esc((team.recebimento||[])[i]||'')}</span><span style="padding:5px;border-left:1px solid #263746">${esc((team.carregamento||[])[i]||'')}</span></div>`).join('')}</div>`}return `<article class="report-table-card"><div class="report-table-title">Informações do Turno</div>${rows.map(x=>`<div class="report-table-row"><span>${esc(x[0])}</span><span>${esc(x[1]||'—')}</span></div>`).join('')}<div class="report-table-subtitle">Dimensionamento da Equipe</div><div class="team-head"><span>Recebimento</span><span>Carregamento</span></div>${[0,1,2,3,4].map(i=>`<div class="team-row"><span>${esc((team.recebimento||[])[i]||'')}</span><span>${esc((team.carregamento||[])[i]||'')}</span></div>`).join('')}</article>`}
function dashboard(id){const r=records().find(x=>x.id===id);if(!r)return toast('Registro não encontrado.');current=r;const cards=sectors.map(s=>`<article class="report-card"><h3>${s}</h3>${r.photos[s]?`<img src="${r.photos[s]}" alt="${esc(s)}">`:'<div class="no-photo">Foto não registrada</div>'}</article>`).join('');wrap(`<div class="no-print page-head"><div><h2>Relatório executivo</h2><p>Pronto para apresentação e impressão.</p></div><button class="btn secondary" onclick="goHistory()">← Histórico</button></div><section class="report"><header class="report-header"><div class="report-brand"><div class="logo">CD</div><div><small>CD Fortaleza</small><h2>Dashboard</h2><p>Responsável: ${esc(r.responsible)}</p></div></div><b>${niceDate(r.date)}</b></header><div class="kpis"><div class="kpi"><small>SETORES</small><strong>${sectors.length}</strong></div><div class="kpi"><small>FOTOS</small><strong>${Object.keys(r.photos||{}).length}</strong></div><div class="kpi"><small>INSPEÇÃO</small><strong style="font-size:19px">${niceDate(r.date)}</strong></div></div><div class="report-grid">${cards}${infoTable(r,false)}</div>${r.notes?`<div class="report-notes"><b>Observações gerais</b><p>${esc(r.notes)}</p></div>`:''}<div class="actions no-print"><button class="btn primary" onclick="shareDashboard()">📤 Compartilhar</button><button class="btn secondary" onclick="generatePDF()">⬇ Gerar PDF</button><button class="btn secondary" onclick="window.print()">▣ Imprimir</button><button class="btn secondary" onclick="downloadHTML()">⇩ Gerar relatório HTML</button><button class="btn secondary" onclick="downloadImages()">⇩ Baixar imagens</button></div></section>`)}
function buildSheet(r){
  const sheetW=1754,sheetH=1240;
  const cells=sectors.map(s=>{const img=r.photos[s];return `<div style="border:1px solid #dce6ef;border-radius:12px;overflow:hidden;display:flex;flex-direction:column;background:#f7fafc;">
    <div style="flex:1;overflow:hidden;background:#eef3f7;">${img?`<img src="${img}" style="width:100%;height:100%;object-fit:cover;display:block">`:'<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:#62788e;font-size:15px;font-weight:600;">Sem foto</div>'}</div>
    <div style="padding:11px 14px;font-size:19px;font-weight:700;color:#172b3f;background:#fff;border-top:1px solid #dce6ef;">${esc(s)}</div>
  </div>`}).join('')+infoTable(r,true);
  const sheet=document.createElement('div');
  sheet.style.cssText='position:fixed;left:-10000px;top:0;width:'+sheetW+'px;height:'+sheetH+'px;background:#fff;';
  sheet.innerHTML=`<div style="font-family:'Segoe UI',Arial,sans-serif;width:100%;height:100%;box-sizing:border-box;padding:46px 56px;display:flex;flex-direction:column;">
    <div style="display:flex;justify-content:space-between;align-items:flex-end;border-bottom:3px solid #0f6cbd;padding-bottom:16px;margin-bottom:22px;">
      <div><div style="font-size:13px;letter-spacing:2px;text-transform:uppercase;color:#0f6cbd;font-weight:700;">CD Logística</div><h1 style="margin:6px 0 0;font-size:46px;color:#092b52;">CD Fortaleza</h1></div>
      <div style="text-align:right;color:#62788e;font-weight:600;font-size:16px;">Atualizado em<br><span style="color:#092b52;font-size:22px;font-weight:800;">${niceDate(r.date)}</span></div>
    </div>
    <div style="flex:1;display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:1fr;gap:18px;">${cells}</div>
  </div>`;
  document.body.appendChild(sheet);
  return {sheet,sheetW,sheetH};
}
async function generatePDF(){
  if(!window.jspdf||!window.html2canvas){toast('Bibliotecas de PDF não carregaram. Verifique sua conexão.');return}
  const overlay=document.getElementById('pdfLoading');overlay.classList.add('show');
  let sheet=null;
  try{
    const r=current;
    const built=buildSheet(r);sheet=built.sheet;
    const canvas=await html2canvas(sheet,{scale:1,backgroundColor:'#ffffff',useCORS:true,width:built.sheetW,height:built.sheetH});
    const {jsPDF}=window.jspdf;
    const doc=new jsPDF({orientation:'landscape',unit:'pt',format:'a4'});
    const pageW=doc.internal.pageSize.getWidth(),pageH=doc.internal.pageSize.getHeight();
    doc.addImage(canvas.toDataURL('image/jpeg',.9),'JPEG',0,0,pageW,pageH);
    doc.save('relatorio-'+r.id+'.pdf');
    toast('PDF gerado com sucesso.');
  }catch(e){toast('Não foi possível gerar o PDF.')}
  finally{if(sheet)sheet.remove();overlay.classList.remove('show')}
}
async function shareDashboard(){
  if(!window.html2canvas){toast('Biblioteca não carregou. Verifique sua conexão.');return}
  const overlay=document.getElementById('pdfLoading');overlay.classList.add('show');
  let sheet=null;
  try{
    const r=current;
    const built=buildSheet(r);sheet=built.sheet;
    const canvas=await html2canvas(sheet,{scale:1,backgroundColor:'#ffffff',useCORS:true,width:built.sheetW,height:built.sheetH});
    const blob=await new Promise(res=>canvas.toBlob(res,'image/jpeg',.92));
    const fileName='dashboard-'+r.id+'.jpg';
    const file=new File([blob],fileName,{type:'image/jpeg'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      await navigator.share({files:[file],title:'Dashboard dos Setores',text:'Dashboard fotográfico - CD Fortaleza'});
      toast('Compartilhado com sucesso.');
    }else{
      const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=fileName;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1500);
      toast('Compartilhamento direto não é suportado neste navegador. Imagem baixada.');
    }
  }catch(e){if(e.name!=='AbortError')toast('Não foi possível compartilhar.')}
  finally{if(sheet)sheet.remove();overlay.classList.remove('show')}
}
function download(name,content,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function downloadHTML(){const clone=document.documentElement.cloneNode(true);clone.querySelector('#app').innerHTML=document.getElementById('app').innerHTML;clone.querySelectorAll('.no-print,.topbar,.toast').forEach(x=>x.remove());download('relatorio-'+current.id+'.html','<!doctype html>'+clone.outerHTML,'text/html;charset=utf-8')}
function downloadImages(){Object.entries(current.photos||{}).forEach(([name,data],i)=>setTimeout(()=>{const a=document.createElement('a');a.href=data;a.download=String(i+1).padStart(2,'0')+'-'+name.replace(/[^a-z0-9]/gi,'-').toLowerCase()+'.jpg';a.click()},i*350))}
Object.assign(window,{home,goForm,goHistory,sync,pickPhoto,removePhoto,finish,delRecord,dashboard,downloadHTML,downloadImages,generatePDF,shareDashboard});
function tick(){const d=new Date();dateNow.textContent=d.toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit',month:'short',year:'numeric'});timeNow.textContent=d.toLocaleTimeString('pt-BR')}tick();setInterval(tick,1000);home();
})();
</script></body></html>
